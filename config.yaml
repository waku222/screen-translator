# Screen Translator 設定ファイル

# ホットキー設定
hotkey:
  modifiers: ["cmd", "shift"]
  key: "t"

# 翻訳設定
translation:
  source_lang: "en"  # 翻訳元言語 ("auto"で自動検出)
  target_lang: "ja"  # 翻訳先言語

# UI設定
ui:
  theme: "dark"  # テーマ: "dark" または "light"
  window_width: 600
  window_height: 500

# ロギング設定
logging:
  level: "INFO"  # ログレベル: DEBUG, INFO, WARNING, ERROR
  file: "/tmp/screen-translator.log"
  max_bytes: 10485760  # 10MB
  backup_count: 3
