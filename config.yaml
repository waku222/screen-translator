# Screen Translator 設定ファイル
#
# このファイルは同梱のひな形です。実際に読み込まれるのは
#   ~/Library/Application Support/ScreenTranslator/config.yaml
# で、初回起動時にこのファイルがそこへ複製されます。
# 設定を変えるときはユーザー領域の方を編集してください（アプリの再ビルドは不要）。

# ホットキー設定
# modifiers に使えるもの: cmd / shift / ctrl / alt（option でも可）
# key に使えるもの: 英字 a-z と数字 0-9
#
# 既定を Ctrl+Option+T にしているのは、Cmd+Shift+T が Chrome の
# 「閉じたタブを再度開く」などと衝突するため。押下を奪い取れないので、
# 他のアプリが使っていない組み合わせを選ぶ必要があります。
hotkey:
  modifiers: ["ctrl", "alt"]
  key: "t"

# 翻訳設定
translation:
  engine: "apple"    # 翻訳エンジン: "apple"（Apple のオンデバイス翻訳）
  source_lang: "en"  # 翻訳元言語（Apple 翻訳では "auto" は使えません）
  target_lang: "ja"  # 翻訳先言語
  timeout: 45        # 翻訳1回を待つ秒数

# UI設定
ui:
  theme: "dark"  # テーマ: "dark" または "light"
  window_width: 600
  window_height: 500

# デバッグ設定
debug:
  # OCR が何も読み取れなかったとき、取り込んだ画面画像を
  #   ~/Library/Logs/ScreenTranslator-failed-capture.png
  # に保存する。画面の内容がディスクに残るため既定では無効。
  # 読み取れない原因を調べるときだけ true にしてください。
  save_failed_capture: false

# ロギング設定
logging:
  level: "INFO"  # ログレベル: DEBUG, INFO, WARNING, ERROR
  file: "~/Library/Logs/ScreenTranslator.log"
  max_bytes: 10485760  # 10MB
  backup_count: 3
